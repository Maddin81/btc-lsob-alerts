# -----------------------------------------------------------------------------
# Beispiel-Konfiguration fuer die eigene Kamera-Software (Camera-NVR)
#
# Kopiere diese Datei nach  config.yaml  und trage deine Kameras ein.
# ODER: einfach starten und alles im Browser unter "Kameras verwalten" anlegen -
# die Software schreibt diese Datei dann selbst.
#
# Passwoerter gehoeren NICHT im Klartext hier rein, sondern als
# Umgebungsvariable:   password: "${CAM_HAUSTUER_PASS}"   (siehe .env.example)
# -----------------------------------------------------------------------------

server:
  host: "0.0.0.0"
  port: 8080
  # Optionaler Zugangsschutz fuer das Web-Dashboard (Basic Auth).
  # Leer lassen = kein Login.
  auth_user: ""
  auth_pass: ""

# Wohin Snapshots / Ereignisse gespeichert werden (im Container gemountet).
storage:
  events_dir: "/data/events"
  # Aeltere Ereignis-Snapshots automatisch loeschen (Tage). 0 = nie.
  retention_days: 14

# Globale Benachrichtigungen bei Bewegung.
# Es koennen mehrere Kanaele gleichzeitig aktiv sein.
notify:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  webhook:
    enabled: false
    url: "https://example.com/hook"
  # Mindestabstand zwischen zwei Alarmen derselben Kamera (Sekunden),
  # damit du bei Dauerbewegung nicht zugespammt wirst.
  cooldown_seconds: 60

# -----------------------------------------------------------------------------
# Kameras. Beliebig viele - jede mit EIGENEN Zugangsdaten, eigenem ONVIF-Port
# und eigenem Bildformat.
#
#   aspect:  "auto"  = wird aus dem laufenden Stream gemessen (Standard)
#            "16:9"  = uebliche Kamera
#            "10:3"  = sehr breite Kamera (z.B. 1920x576)
# Das Bildformat betrifft nur die Darstellung der Kachel im Dashboard.
# -----------------------------------------------------------------------------
cameras:
  - id: "haustuer"
    name: "Haustuer"
    host: "192.168.1.46"
    username: "admin"
    password: "${CAM_HAUSTUER_PASS}"
    # Haupt-Stream (hohe Aufloesung).
    rtsp_main: "rtsp://admin:${CAM_HAUSTUER_PASS}@192.168.1.46:554/Streaming/Channels/101"
    # Sub-Stream (niedrige Aufloesung) - wird fuer Live-Grid + Bewegungserkennung
    # verwendet. Spart massiv CPU. Wenn leer, wird rtsp_main benutzt.
    rtsp_sub: "rtsp://admin:${CAM_HAUSTUER_PASS}@192.168.1.46:554/Streaming/Channels/102"
    onvif_port: 8999
    ptz: false
    enabled: true
    aspect: "16:9"
    motion:
      enabled: true
      # Empfindlichkeit: kleinere Zahl = empfindlicher.
      # Anteil veraenderter Pixel (Prozent), ab dem Bewegung erkannt wird.
      sensitivity_percent: 1.5
      # Bereich (x,y,w,h in Prozent 0-100) auf den geachtet wird. Leer = ganzes Bild.
      region: []

  - id: "carport"
    name: "Carport"
    host: "192.168.1.31"
    username: "admin"
    password: "${CAM_CARPORT_PASS}"
    # Reolink: Haupt-Stream 5120x1552 (h265), Sub-Stream 1920x576 (h264).
    rtsp_main: "rtsp://admin:${CAM_CARPORT_PASS}@192.168.1.31:554/h264Preview_01_main"
    rtsp_sub: "rtsp://admin:${CAM_CARPORT_PASS}@192.168.1.31:554/h264Preview_01_sub"
    onvif_port: 8000
    ptz: false
    enabled: true
    # Diese Kamera ist deutlich breiter als 16:9 (1920x576 = 10:3).
    # Die Kachel bekommt dadurch im Dashboard automatisch zwei Spalten.
    aspect: "10:3"
    motion:
      enabled: true
      sensitivity_percent: 2.0
      region: []

  - id: "garten"
    name: "Garten"
    host: "192.168.1.160"
    username: "admin"
    password: "${CAM_GARTEN_PASS}"
    rtsp_main: "rtsp://admin:${CAM_GARTEN_PASS}@192.168.1.160:554/Streaming/Channels/101"
    rtsp_sub: "rtsp://admin:${CAM_GARTEN_PASS}@192.168.1.160:554/Streaming/Channels/102"
    onvif_port: 80
    ptz: false
    enabled: true
    aspect: "16:9"
    motion:
      enabled: true
      sensitivity_percent: 1.5
      region: []
